   <main>
      <section class="registro-container">
        <form id="form-registro" novalidate>
          <fieldset>
            <legend>Registro de usuario</legend>

            <div class="campo">
              <label for="run">Run</label>
              <input type="text" id="run" name="run" placeholder="Ej: 21243933K" maxlength="9" required>
              <span class="error" id="error-run"></span>
            </div>
            <div class="campo">
              <label for="nombre">Nombre</label>
              <input type="text" id="nombre" name="nombre" maxlength="50" required>
              <span class="error" id="error-nombre"></span>
            </div>
            <div class="campo">
              <label for="apellidos">Apellidos</label>
              <input type="text" id="apellidos" name="apellidos" maxlength="50" required>
              <span class="error" id="error-apellidos"></span>
            </div>
            <div class="campo">
              <label for="correo">Correo</label>
              <input type="email" id="correo" name="correo" maxlength="100"required>
              <span class="error" id="error-correo"></span>
            </div>
            <div class="campo">
              <label for="password">Contraseña</label>
              <input type="password" id="password" name="password" required>
              <span class="error" id="error-password"></span>
            </div>
            <div class="campo">
              <label for="password2">Confirmar Contraseña</label>
              <input type="password" id="password2" name="password2" required>
              <span class="error" id="error-password2"></span>
            </div>
            <div class="campo">
              <label for="telefono">Teléfono (opcional)</label>
              <input type="tel" id="telefono" name="telefono">
            </div>
            <div class="campo">
              <label for="fecha-nacimiento">Fecha de nacimiento</label>
              <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
            </div>
            <div class="campo">
              <label for="region">Región</label>
              <select id="region" name="region" required>
                <option value="">--- Seleccione la región ---</option>
              </select>
            </div>
            <div class="campo">
              <label for="comuna">Comuna</label>
              <select id="comuna" name="comuna" required>
                <option value="">--- Seleccione la comuna ---</option>
              </select>
            </div>
            <div class="campo">
              <label for="direccion">Dirección</label>
              <input type="text" id="direccion" name="direccion" maxlength="300" required>
              <span class="error" id="error-direccion"></span>
            </div>

            <button type="submit">Registrar</button>
          </fieldset>

        </form>
      </section>
   </main>
