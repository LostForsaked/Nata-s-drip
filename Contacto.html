    <main class="contacto-main">
        <div class="contacto-logo">
            <img src="img/Logo.jpg" alt="Logo Nata's Drip">
            <h1>Nata's Drip</h1>
        </div>

        <section class="contacto-container">
            <form id="form-contacto" novalidate>
                <fieldset>
                    <legend>Formulario de contactos</legend>

                    <div class="campo">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" name="nombre" id="nombre"  maxlength="100" required>
                        <span class="error" id="error-nombre"></span>
                    </div>

                    <div class="campo">
                        <label for="correo">Correo</label>
                        <input type="email" name="correo" id="correo" maxlength="100">
                        <span class="error" id="error-correo"></span>
                    </div>

                    <div class="campo">
                        <label for="comentario">Comentario</label>
                        <textarea name="comentario" id="comentario" maxlength="500" rows="5" required></textarea>
                        <span class="error" id="error-comentario"></span>
                    </div>

                    <button type="submit">Enviar mensaje</button>
                </fieldset>
            </form>
        </section>
    </main>
