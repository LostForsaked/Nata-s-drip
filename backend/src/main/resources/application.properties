spring.application.name=natasdrip-backend


spring.datasource.url=jdbc:mysql://localhost:3306/natasdrip_api?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=120

app.cors.origenes=http://localhost:5173