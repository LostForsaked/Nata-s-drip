  <div class="offcanvas offcanvas-start" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1" id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasScrollingLabel">Menú de Navegación</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <p>Contenido del menú lateral.</p>
    </div>
  </div>

    
    <main class="container my-5">
    <h2 class="fw-bold mb-4">Mi carrito de compras</h2>

    <div class="row g-4">

      <div class="col-lg-8" id="contenedorCarrito">
  
      </div>


      <div class="col-lg-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 sticky-top" style="top: 20px;">
          <h5 class="fw-bold mb-3">Resumen de Compra</h5>
          
          <div class="d-flex justify-content-between mb-2 text-secondary">
            <span>Subtotal</span>
            <span id="resumenSubtotal">$0</span>
          </div>
          
          <div class="d-flex justify-content-between mb-2 text-success d-none" id="filaDescuento">
            <span>Descuento (10%)</span>
            <span id="resumenDescuento">-$0</span>
          </div>

          <hr>

          <div class="d-flex justify-content-between mb-4">
            <span class="fs-5 fw-bold">TOTAL:</span>
            <span class="fs-4 fw-bold text-primary" id="resumenTotal">$0</span>
          </div>

        
          <div class="mb-3">
            <label class="form-label small text-muted">¿Tienes un cupón de descuento?</label>
            <div class="input-group">
              <input type="text" id="inputCupon" class="form-control" placeholder="Ej: NATAS10">
              <button class="btn btn-outline-secondary" type="button" id="btnCupon">Aplicar</button>
            </div>
            <small id="mensajeCupon" class="d-block mt-1"></small>
          </div>

          <button class="btn btn-success btn-lg w-100 rounded-3 fw-bold py-3 mb-2" id="btnPagar">
            PAGAR AHORA
          </button>
          
          <button class="btn btn-link text-danger btn-sm text-decoration-none w-100" id="btnVaciar">
            <i class="bi bi-trash me-1"></i> Vaciar Carrito
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/productos.js"></script>
