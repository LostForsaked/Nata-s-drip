<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Panel Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/adminStyle.css">
</head>
<body>

    <div class="admin-layout">

        <aside class="admin-sidebar">
            <div class="admin-logo">
                <img src="../img/Logo.jpg" alt="Logo" width="40" class="rounded">
                <span>Nata's Drip</span>
            </div>

            <nav class="admin-nav">
                <ul>
                    <li><a href="home.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li><a href="productos-listado.html" class="active"><i class="bi bi-box-seam"></i> Productos</a></li>
                    <li><a href="usuarios-listado.html"><i class="bi bi-people"></i> Usuarios</a></li>
                </ul>
            </nav>

            <div class="admin-nav-bottom">
                <a href="../index.html"><i class="bi bi-box-arrow-left"></i> Volver a la tienda</a>
                <a href="#" id="btn-logout"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
            </div>
        </aside>

        <main class="admin-content">
            <header class="admin-header admin-header-flex">
                <h1>Productos</h1>
                <a href="productos-nuevo.html" class="btn btn-primary rounded-pill px-4">
                    <i class="bi bi-plus-lg me-1"></i> Nuevo Producto
                </a>
            </header>

            <section class="admin-tabla-container">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Categoría</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos-body">
                        <!-- Las filas se llenan dinámicamente con JS -->
                    </tbody>
                </table>

                <p id="mensaje-vacio" class="text-muted text-center py-4" style="display: none;">
                    Aún no hay productos registrados.
                </p>
            </section>
        </main>

    </div>

    <script src="../js/validaciones.js"></script>
    <script src="../js/productos.js"></script>
    <script src="js/productos-listado.js"></script>
</body>
</html>
