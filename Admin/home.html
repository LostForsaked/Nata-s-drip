<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Nata's Drip</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/adminStyle.css">
</head>
<body>

    <div class="admin-layout">

        <aside class="admin-sidebar">
            <div class="admin-logo">
                <img src="../img/Logo.jpg" alt="Logo" width="40" class="rounded">
                <span>Nata's Drip</span>
            </div>

            <nav class="admin-nav">
                <ul>
                    <li><a href="home.html" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                    <li><a href="productos-listado.html"><i class="bi bi-box-seam"></i> Productos</a></li>
                    <li><a href="usuarios-listado.html"><i class="bi bi-people"></i> Usuarios</a></li>
                </ul>
            </nav>

            <div class="admin-nav-bottom">
                <a href="../index.html"><i class="bi bi-box-arrow-left"></i> Volver a la tienda</a>
                <a href="#" id="btn-logout"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
            </div>
        </aside>

        <main class="admin-content">
            <header class="admin-header">
                <h1>¡Hola, Administrador!</h1>
            </header>

            <section class="admin-welcome">
                <p>Bienvenido al panel de administración de Nata's Drip. Desde aquí puedes gestionar los productos y usuarios de la tienda.</p>
            </section>
        </main>

    </div>

</body>
</html>
