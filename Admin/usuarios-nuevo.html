<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Usuario - Panel Administrador</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/adminStyle.css">
</head>
<body>

  <div class="admin-layout">

    <aside class="admin-sidebar">
      <div class="admin-logo">
        <img src="../img/Logo.jpg" alt="Logo" width="40" class="rounded">
        <span>Nata's Drip</span>
      </div>

      <nav class="admin-nav">
        <ul>
          <li><a href="home.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
          <li><a href="productos-listado.html"><i class="bi bi-box-seam"></i> Productos</a></li>
          <li><a href="usuarios-listado.html" class="active"><i class="bi bi-people"></i> Usuarios</a></li>
        </ul>
      </nav>

      <div class="admin-nav-bottom">
        <a href="../index.html"><i class="bi bi-box-arrow-left"></i> Volver a la tienda</a>
      </div>
    </aside>

    <main class="admin-content">
      <header class="admin-header mb-4">
        <h1>Agregar Nuevo Usuario</h1>
      </header>

      <div class="card border-0 shadow-sm rounded-4 p-4 style="max-width: 600px;">
        <form id="form-nuevo-usuario">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nombre Completo</label>
            <input type="text" id="nombreUsuario" class="form-control" required placeholder="Ej: Juan Pérez">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Correo Electrónico</label>
            <input type="email" id="emailUsuario" class="form-control" required placeholder="correo@ejemplo.com">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Contraseña</label>
            <input type="password" id="passwordUsuario" class="form-control" required placeholder="******">
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Rol de Usuario</label>
            <select id="rolUsuario" class="form-select" required>
              <option value="Vendedor">Vendedor</option>
              <option value="Cliente">Cliente</option>
              <option value="Administrador">Administrador</option>
            </select>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary rounded-pill px-4">Guardar Usuario</button>
            <a href="usuarios-listado.html" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
          </div>
        </form>
      </div>
    </main>

  </div>

  <script src="js/usuarios-listado.js"></script>
</body>
</html>
