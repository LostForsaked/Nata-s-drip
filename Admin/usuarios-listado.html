<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios - Panel Administrador</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/adminStyle.css">
</head>
<body>

  <div class="admin-layout">

    <aside class="admin-sidebar">
      <div class="admin-logo">
        <img src="../img/Logo.jpg" alt="Logo" width="40" class="rounded">
        <span>Nata's Drip</span>
      </div>

      <nav class="admin-nav">
        <ul>
          <li><a href="home.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
          <li><a href="productos-listado.html"><i class="bi bi-box-seam"></i> Productos</a></li>
          <li><a href="usuarios-listado.html" class="active"><i class="bi bi-people"></i> Usuarios</a></li>
        </ul>
      </nav>

      <div class="admin-nav-bottom">
        <a href="../index.html"><i class="bi bi-box-arrow-left"></i> Volver a la tienda</a>
        <a href="#" id="btn-logout"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
      </div>
    </aside>

    <main class="admin-content">
      <header class="admin-header admin-header-flex d-flex justify-content-between align-items-center mb-4">
        <h1>Gestión de Usuarios</h1>
        <a href="usuarios-nuevo.html" class="btn btn-primary rounded-pill px-4">
          <i class="bi bi-person-plus-fill me-1"></i> Nuevo Usuario
        </a>
      </header>

      <section class="admin-tabla-container">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Rol</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-usuarios-body">

          </tbody>
        </table>

        <p id="mensaje-vacio-usuarios" class="text-muted text-center py-4" style="display: none;">
          Aún no hay usuarios registrados.
        </p>
      </section>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/usuarios-listado.js"></script>
  
</body>
</html>
